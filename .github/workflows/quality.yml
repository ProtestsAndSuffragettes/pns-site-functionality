name: Quality

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    baseline:
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        uses: RocketsAreNostalgic/.github/.github/workflows/quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d
        with:
            php-version: ${{ matrix.php }}
            pnpm-version: '11.13.1'
    project:
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    {
                        MYSQL_DATABASE: wordpress_test,
                        MYSQL_ROOT_PASSWORD: root,
                    }
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
                    --health-interval=10s --health-timeout=5s --health-retries=10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            - run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
              with: { version: 11.13.1 }
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with: { node-version-file: package.json, cache: pnpm }
            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
              with:
                  php-version: ${{ matrix.php }}
                  extensions: 'mysqli, zip'
                  tools: 'composer:v2, wp-cli:2.12.0'
            - name: Verify native PHP interpreter
              env:
                  EXPECTED_PHP: ${{ matrix.php }}
              run: |
                  php -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("EXPECTED_PHP") ? 0 : 1);'
            - name: Verify exact pnpm toolchain
              run: test "$(pnpm --version)" = '11.13.1'
            - run: composer validate --strict --no-check-publish --no-check-all
            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: composer check-platform-reqs
            - run: pnpm install --frozen-lockfile
            - run: composer check
            - run: pnpm check
            - run: bash tests/release-workflow-contract.sh
            - run: pnpm release:archive:check
            - run: pnpm release:archive
            - run: |
                  mkdir -p build/wordpress
                  wp core download --path=build/wordpress --version=7.0
                  wp config create --path=build/wordpress --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
                  wp core install --path=build/wordpress --url=http://localhost --title='PNS CI' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
                  archive="dist/pns-site-functionality-$(jq -er '.version' package.json).zip"
                  wp plugin install "$archive" --path=build/wordpress --activate
                  wp plugin is-active pns-site-functionality --path=build/wordpress
                  test "$(wp plugin get pns-site-functionality --field=version --path=build/wordpress)" = "$(jq -er '.version' package.json)"
            - name: Verify Draft Editor against installed archive
              run: |
                  set -euo pipefail
                  export PNS_ROLE_TEST_ROOT="$(realpath build/wordpress)/"
                  export PNS_ROLE_TEST_URL=http://localhost
                  jq -n --arg root "$PNS_ROLE_TEST_ROOT" --arg site_url "$PNS_ROLE_TEST_URL" --arg db_name wordpress_test \
                    '{root: $root, site_url: $site_url, db_name: $db_name}' > "$PNS_ROLE_TEST_ROOT.pns-role-proof.json"
                  PNS_ROLE_TEST_PHASE=active wp eval-file "$GITHUB_WORKSPACE/tests/wordpress/draft-editor-proof.php" --path=build/wordpress
                  wp plugin deactivate pns-site-functionality --path=build/wordpress
                  PNS_ROLE_TEST_PHASE=inactive wp eval-file "$GITHUB_WORKSPACE/tests/wordpress/draft-editor-proof.php" --path=build/wordpress
                  wp plugin activate pns-site-functionality --path=build/wordpress
    quality:
        if: ${{ always() }}
        needs: [baseline, project]
        runs-on: ubuntu-latest
        steps:
            - run: test '${{ needs.baseline.result }}' = success && test '${{ needs.project.result }}' = success
